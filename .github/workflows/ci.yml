name: CI
on:
  push:
  workflow_dispatch:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    container: qmkfm/base_container

    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Add safe directory for Git
        run: |
          git config --global --add safe.directory " $ __w/Vial-qmk/Vial-qmk"

      - name: Initialize Git Submodules
        run: git submodule update --init --recursive

      - name: Verify Vial UID is unique
        run: python3 util/ci_vial_verify_uid.py

      - name: Compile Vial keyboards
        run: |
          make git-submodule
          python3 util/ci_compile_vial_keyboards.py

      - name: Final Build
        run: make gh71:vial
